<style>
/* Layout: one centered column: logo, name, tagline, the orb lineup, one button */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --field:#ffffff; --ink:#1c1b19; --muted:#6e6b64; --line:#dedbd4;
  --me:#e9e7e1; --me-ink:#1c1b19; --bubble:transparent; --code:#1b1b1a; --code-ink:#e6e3dc;
  --accent:#3b6fd8;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;

  --body:"Patrick Hand", "Comic Sans MS", "Segoe Print", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --c-tech:#1f6fff; --c-cook:#ff6b1a; --c-game:#00b060; --c-web:#8b3dff; --c-write:#ffb300; --c-study:#00b3a4; --c-music:#ff2e88; --c-lang:#ff3b30; --c-neb:#141416; --neb-eye:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --panel:#1f1f1e; --field:#212120; --ink:#ecebe7; --muted:#9a9891; --line:#3a3936;

  --accent:#7aa7f2; --c-tech:#4a8dff; --c-cook:#ff7d33; --c-game:#22d17a; --c-web:#a066ff; --c-write:#ffc233; --c-study:#1fd1c0; --c-music:#ff4f9d; --c-lang:#ff5a50; --c-neb:#f4f4f7; --neb-eye:#111111;

:root[data-theme="dark"]{

  --me:#2c2c2a; --me-ink:#ecebe7; --code:#0e0e0d; --code-ink:#dcd9d2;
  --accent:#7aa7f2; --c-tech:#4a8dff; --c-cook:#ff7d33; --c-game:#22d17a; --c-web:#a066ff; --c-write:#ffc233; --c-study:#1fd1c0; --c-music:#ff4f9d; --c-lang:#ff5a50; --c-neb:#f4f4f7; --neb-eye:#111111;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.45;display:grid;place-items:center;padding:32px 16px}
main{width:min(100%,860px);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.lg{width:96px;height:96px;overflow:visible}
h1{font:500 clamp(2.6rem,9vw,4rem)/1 var(--display);margin:0;letter-spacing:-.02em}
.tag{margin:0;color:var(--muted);font-size:1.15rem;max-width:34ch;text-wrap:balance}
.lineup{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:18px 10px;width:100%;margin-top:10px}
.o{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.o .has-orb{width:64px;height:64px}
.o b{font-weight:400;font-size:1.05rem}
.o small{color:var(--muted);font-size:.85rem;line-height:1.2}
.go{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:1.2rem;text-decoration:none;transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fine{color:var(--muted);font-size:.95rem;margin:0;max-width:44ch}
/* Orb characters: flat shapes, dash eyes, idle motion + secondary motion on accessories */
.has-orb{background:none!important;border:none!important;color:inherit!important;overflow:visible}
.has-orb .orb{width:130%;height:130%;margin:-15%;display:block;overflow:visible}
.bot .g.has-orb,.nav .g.has-orb{width:30px;height:30px}
.av.has-orb{width:36px;height:36px;margin-top:-4px}
.home-btn .g.has-orb{width:36px;height:36px}
.mark.has-orb{width:78px;height:78px}
.orb *{transform-box:view-box}
.orb .o-dk{filter:drop-shadow(0 0 .8px var(--ink))}
.orb .o-hop{transform-origin:50px 92px;animation:o-hop 6s cubic-bezier(.3,.7,.4,1) infinite}
.orb .o-shadow{transform-origin:50px 95px;animation:o-shadow 6s cubic-bezier(.3,.7,.4,1) infinite}
.orb .o-squish{transform-origin:50px 92px;animation:o-squish 2.6s ease-in-out infinite}
.orb .o-eyes{animation:o-look 7s ease-in-out infinite}
.orb .o-lids{transform-box:fill-box;transform-origin:center;animation:o-blink 4.2s infinite}
.orb-cook .o-hop,.orb-cook .o-shadow{animation-delay:-1.6s}.orb-game .o-hop,.orb-game .o-shadow{animation-delay:-3.1s}.orb-web .o-hop,.orb-web .o-shadow{animation-delay:-4.4s}
.orb-cook .o-squish{animation-delay:-.7s}.orb-game .o-squish{animation-delay:-1.5s;animation-duration:2.1s}.orb-web .o-squish{animation-delay:-2s}
.orb-cook .o-lids{animation-delay:-1.3s}.orb-game .o-lids{animation-delay:-2.6s}.orb-web .o-lids{animation-delay:-.4s}
.orb-cook .o-eyes{animation-delay:-2.2s}.orb-web .o-eyes{animation-delay:-4.8s}
/* Byte: antenna springs, bulb glows */
.orb .o-ant{transform-origin:50px 37px;animation:o-sway 2.2s ease-in-out infinite}
.orb .o-halo{transform-box:fill-box;transform-origin:center;animation:o-pulse 1.4s ease-in-out infinite}
/* Chef Miso: hat wobbles, steam drifts up */
.orb .o-hat{transform-origin:50px 44px;animation:o-wobble 3s ease-in-out infinite}
.orb .o-steam path{opacity:0;animation:o-steam 2.6s ease-out infinite}
.orb .o-steam .s2{animation-delay:1.3s}
/* Abyss: eyes dart like watching a match, RGB headset, button-mash shake */
.orb-game .o-eyes{animation:o-dart 3.2s ease-in-out infinite}
.orb .o-rgb{animation:o-rgb 3s linear infinite}
.orb-game .o-extra{animation:o-mash 5s infinite}
/* Pixel: propeller spins, code tag floats, body sways */
.orb .o-prop{transform-origin:50px 17px;animation:o-spin .45s linear infinite}
.orb .o-tag{transform-box:fill-box;transform-origin:center;animation:o-float 2.8s ease-in-out infinite}
.orb-web .o-extra{transform-origin:50px 92px;animation:o-tilt 4s ease-in-out infinite}
/* Reactions: hop on hover, pop when picked, look up while thinking */
.bot:hover .o-hop,.nav:hover .o-hop,.home-btn:hover .o-hop{animation:o-hophover .6s cubic-bezier(.3,.7,.4,1)}
.mark.pop .o-hop{animation:o-popin .55s cubic-bezier(.3,1.6,.5,1)}
.think .o-eyes{animation:o-think 1.1s ease-in-out infinite}
.think .o-squish{animation-duration:.9s}
/* Byte: signal bars pulse */
.orb .o-wifi path{animation:o-sig 1.8s ease-in-out infinite}
.orb .o-wifi .w2{animation-delay:.25s}.orb .o-wifi .w3{animation-delay:.5s}
/* Quill writes, Nova's pencil taps + sparkle, Beat bops with notes, Lingo's bubbles pop */
.orb-music .o-squish{animation:o-bop .62s ease-in-out infinite}
.orb .o-note{opacity:0;animation:o-noteup 2.4s ease-out infinite}.orb .o-note.n2{animation-delay:1.2s}
.orb .o-say{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:o-say 3.2s ease-out infinite}.orb .o-say.b2{animation-delay:1.6s}
.orb-write .o-hop{animation-delay:-2.3s}.orb-study .o-hop{animation-delay:-3.7s}.orb-music .o-hop{animation-delay:-.9s}.orb-lang .o-hop{animation-delay:-5.2s}
.orb-write .o-lids{animation-delay:-3.1s}.orb-study .o-lids{animation-delay:-1.9s}.orb-music .o-lids{animation-delay:-.8s}.orb-lang .o-lids{animation-delay:-3.6s}
.orb-write .o-eyes{animation-delay:-1.2s}.orb-study .o-eyes{animation-delay:-3.4s}.orb-lang .o-eyes{animation-delay:-5.9s}
@keyframes o-sig{0%,100%{opacity:.25}40%{opacity:1}}
@keyframes o-bop{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
@keyframes o-noteup{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-14px) rotate(8deg);opacity:0}}
@keyframes o-say{0%{transform:scale(.3);opacity:0}10%{transform:scale(1.08);opacity:1}16%{transform:scale(1)}42%{opacity:1}50%{opacity:0;transform:scale(1)}100%{opacity:0}}

.orb .o-ink{stroke-dasharray:40;animation:o-ink 2.8s ease-in-out infinite}
.orb .o-pen{animation:o-pen 2.8s ease-in-out infinite}
.orb .o-glow{transform-box:fill-box;transform-origin:center;animation:o-aha 3.6s ease-in-out infinite}
.orb .o-rays{transform-origin:50px 51px;animation:o-rays 3.6s ease-in-out infinite}
.orb .o-spk{transform-box:fill-box;transform-origin:center;animation:o-thump .62s ease-out infinite}
.orb .o-eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:o-eq .42s ease-in-out infinite alternate}
.orb .o-eq rect:nth-child(2){animation-delay:-.2s}.orb .o-eq rect:nth-child(3){animation-delay:-.33s}.orb .o-eq rect:nth-child(4){animation-delay:-.1s}
.orb-lang .o-extra{transform-origin:50px 17px;animation:o-tilt 3.2s ease-in-out infinite}
.orb .o-tassel{transform-origin:50px 91px;animation:o-sway 1.6s ease-in-out infinite}
.orb .o-swirl{transform-origin:50px 56px;animation:o-rot 3.2s linear infinite}
.orb .o-swirl2{transform-origin:50px 56px;animation:o-rot 6.5s linear infinite reverse}

.orb .o-stars circle:nth-child(2){animation-delay:-.8s}.orb .o-stars circle:nth-child(3){animation-delay:-1.5s}
.orb-neb .o-hop{animation-delay:-1s}.orb-neb .o-lids{animation-delay:-2.2s}.orb-neb .o-eyes{animation-delay:-3s}

@keyframes o-blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes o-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes o-pulse{0%,100%{opacity:.12;transform:scale(.75)}50%{opacity:.5;transform:scale(1.2)}}
@keyframes o-wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

@keyframes o-dart{0%,30%{transform:translate(-3px,0)}35%,65%{transform:translate(3px,0)}70%,100%{transform:translate(-3px,0)}}

</style>

let nebN = 0;
function orbSVG(k){
  const o = ORB[k], y = o.ey;
  const eye = x => `<rect x="${x-3}" y="${y-8.5}" width="6" height="17" rx="3" fill="${k === "neb" ? "var(--neb-eye)" : "#111"}" transform="rotate(${o.tilt} ${x} ${y})"/>`;
  return `<svg class="orb orb-${k}" viewBox="0 0 100 100" aria-hidden="true" style="color:var(${BOTS[k].color})">
    <g class="o-hop"><g class="o-extra"><g class="o-squish">
      ${o.back ? o.back() : ""}<g fill="var(${BOTS[k].color})">${o.shape}</g>
      <g class="o-eyes"><g class="o-lids">${eye(42)}${eye(58)}</g></g>
      ${o.acc}
    </g></g></g></svg>`;
}
function orbInto(el, k){ if (!el || !k) return; el.innerHTML = orbSVG(k); el.classList.add("has-orb"); }

document.getElementById("lineup").innerHTML = ORDER.map(k => `<div class="o"><div class="has-orb">${orbSVG(k)}</div><b>${BOTS[k].name}</b><small>${BOTS[k].role}</small></div>`).join("");
